# English ingredient names → the Estonian words Estonian stores name products with (WEB-51).
# Most recipes people find on Instagram are in English, and expats type their list in English. A recipe line or a
# typed item whose name is here is searched (and, for a recipe, written) with the Estonian word.
# Keys are singular and lower case: plurals ("onions", "tomatoes", "berries") and words like "fresh", "chopped",
# "large" are handled in core/english.py. Longer names win ("red onion" before "onion").
# A name that is also an Estonian word stays out ("paprika" is the spice in English, the vegetable here).
# Every value must find the thing at the stores: scripts/check_english.py searches Rimi and Barbora for the words
# web/vocab.json doesn't have (Selver's). New names come from the English lines the recipe_text log shows as
# skipped. Left out for now, the stores have nothing that fits: mackerel, pork belly, tahini, pine nuts, lamb mince,
# worcestershire sauce, shiitake, broad beans, squid, fish stock, custard, groundnut oil, shortcrust pastry.
