# Names for the same thing, as stores and recipes write them. When a typed item (or a recipe's ingredient
# line) finds nothing exactly at a store, the other names in its group are searched too: Rimi has no
# "tomatipüree", only "Tomati Passata"; Barbora's passata is "Tomatipüree"; Selver's search only matches whole
# words, so fresh tomatoes are found as "Kobartomat" or "Ploomtomat", not "tomat". Only for things that really
# are the same, not substitutes (grana padano is not parmesan). Found with scripts/missing_report.py; keep it small.
groups:
  - [passeeritud tomatid, passata, tomatipassata, tomatipüree]
  - [parmesan, parmesani juust, parmigiano reggiano, parmigiano]
  - [kruubid, odrakruubid, odrakruup, pärlkruup, odra pärlkruup]
  - [tomat, tomatid, värsked tomatid, kobartomat, ploomtomat]
  - [tursk, tursafilee, tursa filee]
  - [kanakintsuliha, broileri kintsuliha, kana kintsuliha]

# Swaps: different things that do the same job in a dinner. Tried only when an item and its other names find
# nothing at a store; the receipt tags the line "swap" so it's never a surprise. Rimi rarely has cod, but has
# pangasius and hake fillets.
swaps:
  - [tursafilee, tursk, pangaasiusefilee, merluusifilee, tilaapiafilee, kilttursafilee, kohafilee, heik]
