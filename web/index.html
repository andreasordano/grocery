<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>pantryrun</title>
  <meta name="description" content="Pick tonight's dinner. Get one store and a shopping list.">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16183a" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="icon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@600;700;800&amp;family=Funnel+Sans:wght@400;500;600;700&amp;family=Martian+Mono:wght@400;600&amp;display=swap">

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/controls.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/dinner.css">
  <link rel="stylesheet" href="css/items.css">
  <link rel="stylesheet" href="css/receipt.css">
  <link rel="stylesheet" href="css/sheet.css">
  <link rel="stylesheet" href="css/peek.css">
  <link rel="stylesheet" href="css/recipe.css">

  <script type="module" src="js/main.js"></script>
</head>
<body>

<header class="bar">
  <div class="brand">pantryrun</div>
  <div class="switch" role="group" aria-label="What you need">
    <span class="pill" aria-hidden="true"></span>
    <button type="button" data-mode="dinner" aria-pressed="true">Dinner</button>
    <button type="button" data-mode="list" aria-pressed="false">Shopping list</button>
  </div>
</header>

<main>
  <!-- The current screen: dinners, writing your own dinner, or the shopping list (js/screens.js). -->
  <div id="pick" class="pick">
    <noscript><p class="sub">pantryrun needs JavaScript to find your store.</p></noscript>
  </div>

  <!-- The answer: a receipt prints out of the slot (js/receipt.js). -->
  <section class="printer" aria-label="Where to shop" aria-live="polite">
    <div class="slot" aria-hidden="true"></div>
    <div class="feed paper-shadow" id="feed">
      <div class="receipt"><div class="waiting"><strong>Getting the dinners</strong>One moment.</div></div>
    </div>
    <div class="after" id="after"></div>
  </section>
</main>

<footer class="foot"><a href="privacy.html">Privacy</a></footer>

<dialog id="hello" aria-labelledby="helloTitle">
  <form method="dialog" id="helloForm">
    <div class="sh-top">
      <h2 id="helloTitle">What’s your name?</h2>
      <p>So we know who tried it and what to improve. No password needed. <a href="privacy.html">How pantryrun uses your data</a></p>
      <label for="helloName">Name</label>
      <input id="helloName" name="name" autocomplete="given-name" maxlength="40" required>
    </div>
    <div class="sh-bottom">
      <button class="btn dark" type="submit" value="save">Start</button>
    </div>
  </form>
</dialog>

<!-- Where someone usually shops, asked once after the name (js/identity.js). -->
<dialog id="usual" aria-labelledby="usualTitle">
  <form method="dialog" id="usualForm">
    <div class="sh-top">
      <h2 id="usualTitle">Where do you usually shop?</h2>
      <p>One tap. It shows whether pantryrun sends you somewhere new.</p>
      <div class="chips usual-chips">
        <button type="submit" value="selver">Selver</button>
        <button type="submit" value="rimi">Rimi</button>
        <button type="submit" value="maxima">Maxima</button>
        <button type="submit" value="other">Other</button>
      </div>
    </div>
    <div class="sh-bottom"><button class="link" type="submit" value="skip">Skip</button></div>
  </form>
</dialog>

<!-- A quick look at a receipt line's product (js/peek.js). -->
<div id="peek" popover></div>

<!-- Choosing another product, and preferences (js/products.js). -->
<dialog id="sheet">
  <form method="dialog" id="sheetForm"></form>
</dialog>

</body>
</html>
