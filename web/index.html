<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>pantryrun</title>
<meta name="description" content="Pick tonight's dinner. Get one store and a shopping list.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16183a" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><ellipse cx='32' cy='32' rx='30' ry='22' transform='rotate(-12 32 32)' fill='%23ff4d6d'/><text x='32' y='42' text-anchor='middle' font-family='Arial Black,Arial,sans-serif' font-weight='900' font-size='30' fill='%23fff' transform='rotate(-12 32 32)'>pr</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@600;700;800&family=Funnel+Sans:wght@400;500;600;700&family=Martian+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* pantryrun: the produce sticker. Estonian garden colours on white; stickers only mark what's yours or a deal. */
:root {
  --milk: #ffffff;
  --ink: #1c1f4a;            /* blueberry */
  --ink-soft: #5b5f86;
  --line: rgba(28, 31, 74, 0.12);
  --hover: rgba(28, 31, 74, 0.05);
  --rhubarb: #ff4d6d;
  --rhubarb-text: #d6284b;   /* rhubarb that passes as text on white */
  --panel: #ffdce3;          /* rhubarb milk: where the answer prints */
  --butter: #ffd84d;
  --dill: #17824a;
  --sheet: #ffffff;
  --slot: #1c1f4a;
  --display: "Funnel Display", ui-sans-serif, system-ui, sans-serif;
  --sans: "Funnel Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Martian Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --ease: cubic-bezier(.3, .7, .2, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --milk: #16183a; --ink: #f3f1ff; --ink-soft: #a9abd0; --line: rgba(243, 241, 255, 0.14); --hover: rgba(243, 241, 255, 0.07);
    --rhubarb-text: #ff7d93; --panel: #2a1d4a; --sheet: #1f2250; --slot: #0b0c24;
  }
}
:root[data-theme="dark"] {
  --milk: #16183a; --ink: #f3f1ff; --ink-soft: #a9abd0; --line: rgba(243, 241, 255, 0.14); --hover: rgba(243, 241, 255, 0.07);
  --rhubarb-text: #ff7d93; --panel: #2a1d4a; --sheet: #1f2250; --slot: #0b0c24;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  min-height: 100vh; min-height: 100dvh;
  background: var(--milk); color: var(--ink);
  font: 400 16px/1.5 var(--sans);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2.5px solid var(--rhubarb); outline-offset: 3px; }
[hidden] { display: none !important; }

/* ── Top bar ───────────────────────────────────────────────────────────── */
.bar {
  position: absolute; top: 0; left: 0; right: 0; z-index: 20;
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: max(20px, env(safe-area-inset-top)) 40px 20px max(40px, calc(58vw - 780px));
}
/* The logo is a produce sticker: an oval label slapped on slightly crooked. */
.brand {
  display: inline-block; padding: 8px 22px 9px; border-radius: 50%;
  background: var(--rhubarb); color: #fff;
  font: 800 21px/1 var(--display); letter-spacing: -0.03em;
  transform: rotate(-5deg);
  box-shadow: 0 1px 0 rgba(28, 31, 74, .15), 0 6px 14px -8px rgba(214, 40, 75, .7);
}

.switch { position: relative; display: inline-flex; padding: 4px; border-radius: 999px; background: var(--milk); box-shadow: inset 0 0 0 1.5px var(--ink); }
.switch button {
  position: relative; z-index: 1; border: 0; background: none; cursor: pointer;
  padding: 8px 16px; border-radius: 999px; font-weight: 600; font-size: 14px; color: var(--ink);
  transition: color .25s;
}
.switch button[aria-pressed="true"] { color: var(--milk); }
.switch .pill { position: absolute; top: 4px; bottom: 4px; left: 3px; border-radius: 999px; background: var(--ink);
  transition: transform .35s var(--ease), width .35s var(--ease); }

/* ── Layout: choose on the left, the answer prints on the rhubarb panel ── */
main {
  min-height: 100vh; min-height: 100dvh;
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(400px, 42%);
}
#left { padding: 116px 56px 56px 40px; max-width: 820px; width: 100%; justify-self: end; }
.printer { position: relative; background: var(--panel); padding: 108px 48px 56px; }
/* slot, receipt and buttons share one centred column; the paper is inset from the slot's ends */
.printer > * { width: 100%; max-width: 400px; margin-inline: auto; }

h1 {
  margin: 0 0 28px; font: 800 clamp(44px, 5.4vw, 76px)/.98 var(--display); letter-spacing: -0.035em;
}
h1 .for { white-space: nowrap; }
.sub { margin: 0 0 20px; color: var(--ink-soft); font-size: 17px; max-width: 34ch; }

/* How many people: a butter sticker in the headline */
.stepper {
  display: inline-flex; align-items: center; gap: .1em; vertical-align: .06em;
  padding: .06em .1em; margin: 0 .04em; border-radius: 999px;
  background: var(--butter); color: #1c1f4a; transform: rotate(-3deg);
  font: inherit; letter-spacing: 0;
}
.stepper output { min-width: .6em; text-align: center; font-variant-numeric: tabular-nums; line-height: 1; }
.stepper button { width: max(32px, .46em); height: max(32px, .46em); border: 0; border-radius: 50%; background: #fff; cursor: pointer;
  font: 700 max(18px, .28em)/1 var(--sans); color: #1c1f4a; display: grid; place-items: center; transition: transform .15s; }
.stepper button:hover { transform: scale(1.08); }
.stepper button:active { transform: scale(.94); }
/* in smaller places (the dinner editor) the sticker is text-sized */
.sub .stepper { font: 700 17px var(--sans); padding: 3px; transform: none; gap: 4px; }
.sub .stepper button { width: 28px; height: 28px; font-size: 16px; }

/* kinds of dinner: plain text pills */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips button { border: 0; cursor: pointer; padding: 7px 14px; border-radius: 999px; font-size: 14px; font-weight: 500;
  background: none; box-shadow: inset 0 0 0 1.5px var(--line); transition: box-shadow .2s, background .2s; }
.chips button:hover { box-shadow: inset 0 0 0 1.5px var(--ink); }
.chips button[aria-pressed="true"] { background: var(--ink); color: var(--milk); box-shadow: none; }
.cats { margin: 0 0 18px; }

/* dinners: a menu in big type */
.dishes { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 28px; }
.dishes li { border-bottom: 1.5px solid var(--line); }
.dish {
  width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: left; cursor: pointer;
  border: 0; background: none; padding: 15px 4px 14px;
  font: 600 21px/1.15 var(--display); letter-spacing: -0.02em;
  min-width: 0; overflow-wrap: anywhere; hyphens: auto;  /* long Estonian compounds: Suvikõrvitsapüreesupp */
  transition: color .2s, padding .25s var(--ease);
}
.dish:hover { color: var(--rhubarb-text); }
.dish::after {
  content: "✓"; flex: none; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%;
  font: 800 15px/1 var(--sans); color: #fff; background: var(--rhubarb);
  transform: scale(0) rotate(-30deg); transition: transform .3s cubic-bezier(.3, 1.6, .5, 1);
}
.dish[aria-pressed="true"] { color: var(--rhubarb-text); padding-left: 10px; }
.dish[aria-pressed="true"]::after { transform: none; }
.more { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 14px; }

/* adding items (dinner extras and the shopping list) */
.extras { margin-top: 30px; max-width: 520px; }
.extras h2 { margin: 0 0 10px; font: 700 17px var(--display); letter-spacing: -0.01em; }
.open-extras { border: 0; background: none; padding: 0; cursor: pointer; font-weight: 600; color: var(--ink); }
.open-extras span { display: inline-grid; place-items: center; width: 26px; height: 26px; margin-right: 8px; border-radius: 50%;
  background: var(--butter); color: #1c1f4a; font-weight: 800; }
.open-extras:hover { color: var(--rhubarb-text); }
.field { position: relative; display: flex; gap: 8px; max-width: 480px; }
.field input {
  flex: 1; min-width: 0; padding: 13px 18px; border-radius: 999px; border: 0; outline: none;
  background: var(--milk); color: var(--ink); font: 16px var(--sans);
  box-shadow: inset 0 0 0 1.5px var(--line);
}
.field input:focus { box-shadow: inset 0 0 0 2px var(--ink); }
/* suggestions while typing: product words from the store catalogs */
.suggest {
  position: absolute; z-index: 15; top: calc(100% + 6px); left: 0; right: 0;
  list-style: none; margin: 0; padding: 6px; border-radius: 18px;
  background: var(--sheet); box-shadow: 0 0 0 1.5px var(--ink), 0 18px 36px -20px rgba(28, 31, 74, .5);
}
.suggest li { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 8px 12px; border-radius: 12px; cursor: pointer; font-weight: 500; }
.suggest li[aria-selected="true"], .suggest li:hover { background: var(--panel); }
.suggest .s-shelf { font-size: 12px; color: var(--ink-soft); text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; list-style: none; padding: 0; }
.tags li { display: inline-flex; align-items: center; gap: 2px; padding: 4px 4px 4px 12px; border-radius: 999px; background: var(--butter); color: #1c1f4a; font-size: 14px; font-weight: 600; }
.tags button, .items li button { border: 0; background: none; cursor: pointer; color: var(--ink-soft); border-radius: 50%; }
.tags button { width: 24px; height: 24px; font-size: 15px; color: #1c1f4a; }
.tags button:hover, .items li button:hover { background: var(--hover); color: var(--ink); }
.items { list-style: none; margin: 18px 0 24px; padding: 0; max-width: 480px; }
.items li { display: flex; align-items: center; justify-content: space-between; padding: 10px 0 10px 2px; border-bottom: 1.5px solid var(--line);
  font: 600 19px/1.2 var(--display); letter-spacing: -0.01em; }
.items li button { font-size: 18px; width: 32px; height: 32px; }
.items .none { color: var(--ink-soft); font: 400 16px var(--sans); border: 0; }
/* tap an item to change it, e.g. to add an amount ("paprika" → "paprika 600g") */
.items .it, .tags .it { flex: 1; min-width: 0; text-align: left; border: 0; background: none; padding: 0; font: inherit; color: inherit; cursor: text; }
.items li button.it, .tags button.it { width: auto; height: auto; font-size: inherit; color: inherit; border-radius: 0; }
.items .it:hover, .tags .it:hover { background: none; text-decoration: underline dotted; text-underline-offset: 4px; }
.items input.edit, .tags input.edit { flex: 1; min-width: 0; font: inherit; color: inherit; background: var(--hover); border: 0; outline: none;
  border-radius: 8px; padding: 2px 6px; box-shadow: inset 0 0 0 2px var(--ink); }

/* my dinners: the editor */
.editor label { display: block; margin: 0 0 6px; font-size: 14px; font-weight: 700; }
.editor .name { width: 100%; max-width: 480px; padding: 13px 18px; border-radius: 999px; border: 0; outline: none;
  background: var(--milk); color: var(--ink); font: 600 19px var(--display); box-shadow: inset 0 0 0 1.5px var(--line); }
.editor .name:focus { box-shadow: inset 0 0 0 2px var(--ink); }
.editor h2 { margin: 26px 0 4px; font: 700 17px var(--display); }
.editor .fine { margin: 0 0 10px; }
.editor .actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.editor .error { color: var(--rhubarb-text); font-size: 14px; margin: 10px 0 0; min-height: 1.5em; }
.dishes .mine { display: flex; align-items: center; gap: 4px; }
.dishes .mine .dish { flex: 1; }
.dishes .mine .link { flex: none; padding: 6px; }
.empty { color: var(--ink-soft); max-width: 460px; margin: 4px 0 14px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 0; border-radius: 999px; padding: 14px 22px; cursor: pointer;
  font-weight: 700; font-size: 15px; transition: transform .15s, opacity .2s, background .2s;
}
.btn:active { transform: scale(.97); }
.btn.go { background: var(--rhubarb); color: #1c1f4a; }
.btn.go:hover { background: #ff3a5e; }
.btn.quiet { background: none; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); }
.btn.quiet:hover { background: var(--hover); }
.btn.dark { background: var(--ink); color: var(--milk); }
.btn[disabled] { opacity: .35; cursor: default; }
.link { border: 0; background: none; padding: 0; cursor: pointer; color: var(--ink); font-size: 14px; font-weight: 500;
  text-decoration: underline; text-decoration-thickness: 1.5px; text-underline-offset: 4px; }
.link:hover { color: var(--rhubarb-text); }

/* ── The printer and the receipt ───────────────────────────────────────── */
.slot {
  position: relative; z-index: 3; height: 16px; border-radius: 8px; background: var(--slot);
  box-shadow: inset 0 -3px 0 rgba(255, 255, 255, 0.1), 0 8px 16px -8px rgba(28, 31, 74, .5);
}
.feed { position: relative; z-index: 2; margin-top: -8px; padding-inline: 14px; transition: opacity .2s; }
.feed.busy { opacity: .45; pointer-events: none; }
.paper-shadow { filter: drop-shadow(0 18px 22px rgba(120, 20, 50, 0.16)); }

/* Always paper-white, also in dark mode. */
.receipt {
  position: relative; color: #1c1f4a; background-color: #fff;
  font: 400 12px/1.5 var(--mono);
  --tooth: 9px;
  padding: 22px 20px calc(18px + var(--tooth));
  -webkit-mask: linear-gradient(#000 0 0) top / 100% calc(100% - var(--tooth)) no-repeat,
                conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom / calc(var(--tooth) * 2) var(--tooth) repeat-x;
          mask: linear-gradient(#000 0 0) top / 100% calc(100% - var(--tooth)) no-repeat,
                conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom / calc(var(--tooth) * 2) var(--tooth) repeat-x;
}
.receipt.printing { animation: print 1.1s cubic-bezier(.25, .6, .2, 1) both; }
@keyframes print {
  from { clip-path: inset(0 0 100% 0); transform: translateY(-24px); }
  to   { clip-path: inset(0 0 -40px 0); transform: none; }
}

.r-center { text-align: center; }
.r-go, .r-what, .r-hint, .r-head { color: #5b5f86; }
.r-store { font: 800 46px/1 var(--display); letter-spacing: -0.04em; margin: 4px 0 6px; }
.r-delta { margin-top: 6px; color: #d6284b; }
.r-rule { border: 0; border-top: 1.5px dashed rgba(28, 31, 74, 0.3); margin: 14px 0; }
.r-head { margin: 10px 0 4px; }
.r-items { list-style: none; margin: 0 -8px; padding: 0; display: grid; gap: 2px; }
.r-line {
  width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 12px;
  text-align: left; border: 0; background: none; color: inherit; font: inherit; cursor: pointer;
  padding: 4px 8px; border-radius: 6px;
}
.r-line:hover { background: #fff0f3; }
.r-line .n { font-weight: 600; }
.r-line .amt { color: #5b5f86; font-weight: 400; }
/* Product names wrap: stores put the pack size ("10tk", "500g") at the end. */
.r-line .p { grid-column: 1; color: #5b5f86; font-size: 11.5px; overflow-wrap: anywhere; }
.r-line .shelf { color: #8c8fae; }
.r-line .c { grid-column: 2; grid-row: 1; text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.r-line .c s { color: #8c8fae; font-weight: 400; margin-right: 6px; text-decoration-thickness: 1px; }
.r-line .d { grid-column: 1; color: #d6284b; font-size: 11px; }
/* sale: the yellow shelf tag */
.r-off { display: inline-block; margin-left: 6px; padding: 1px 6px; border-radius: 4px; font-size: 10px; font-weight: 600; background: #ffd84d; color: #1c1f4a; }
.r-save { display: flex; justify-content: space-between; margin-top: 6px; color: #17824a; font-weight: 600; }
.r-card { color: #5b5f86; margin-top: 2px; }
.r-pantry button { border: 0; background: none; padding: 0 1px; font: inherit; color: #1c1f4a; text-decoration: underline dotted; text-underline-offset: 3px; cursor: pointer; }
.r-pantry button:hover { color: #d6284b; }
.opts s { color: var(--ink-soft); font-weight: 400; margin-right: 6px; }
.r-tag { display: inline-block; margin-left: 6px; padding: 0 5px; border: 1px solid currentColor; border-radius: 4px; font-size: 10px; font-weight: 400; color: #d6284b; }
.r-hint { margin-top: 8px; font-size: 11px; }
.r-total { display: flex; justify-content: space-between; align-items: baseline; font: 800 26px/1 var(--display); letter-spacing: -0.02em; }
.r-note { margin-top: 10px; color: #5b5f86; }
.r-missing { margin-top: 10px; color: #d6284b; }
.stores { list-style: none; margin: 2px -8px 0; padding: 0; }
.stores button {
  width: 100%; display: flex; gap: 6px; align-items: baseline; border: 0; background: none; cursor: pointer;
  color: inherit; font: inherit; padding: 2px 8px; border-radius: 6px; text-align: left;
}
.stores button:hover { background: #fff0f3; }
.stores button::after { content: ""; order: 1; flex: 1; border-bottom: 1px dotted rgba(28, 31, 74, 0.45); transform: translateY(-4px); }
.stores .v { order: 2; font-variant-numeric: tabular-nums; }
.stores [aria-current="true"] { font-weight: 600; }
.stores [aria-current="true"] .s::before { content: "▸ "; }

/* "I'll go there": a butter sticker slapped on the receipt */
.stamp {
  position: absolute; right: 10px; top: 12px; z-index: 2; pointer-events: none;
  display: grid; place-items: center; width: 76px; height: 76px; border-radius: 50%;
  background: #ffd84d; color: #1c1f4a; box-shadow: 0 4px 10px -4px rgba(28, 31, 74, .4);
  font: 800 18px/1 var(--display); letter-spacing: -0.02em;
  transform: rotate(12deg); animation: stamp .4s cubic-bezier(.3, 1.6, .5, 1) both;
}
@keyframes stamp { from { transform: rotate(-20deg) scale(1.8); opacity: 0; } }

.waiting { color: #5b5f86; text-align: center; padding: 14px 6px 6px; }
.waiting b { display: block; color: #1c1f4a; font: 700 20px/1.25 var(--display); letter-spacing: -0.02em; margin-bottom: 6px; }
.dots i { display: inline-block; font-style: normal; animation: blink 1.2s infinite both; }
.dots i:nth-child(2) { animation-delay: .2s; }
.dots i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }

.after { margin-top: 18px; padding: 0 14px; }
.actions { display: flex; gap: 8px; }
.actions .btn { flex: 1; }
.thanks { margin: 0; font: 700 18px var(--display); }
.small { margin-top: 14px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: baseline; }
.fine { font-size: 12.5px; color: var(--ink-soft); }
.report { margin-top: 12px; display: flex; gap: 8px; }
.share { margin-top: 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.share input { flex: 1 1 100%; padding: 9px 14px; border-radius: 999px; border: 0; background: var(--milk); color: var(--ink);
  font: 13px var(--sans); box-shadow: inset 0 0 0 1.5px var(--line); }
/* a dinner someone sent by link */
.sent { display: flex; align-items: center; justify-content: space-between; gap: 10px 14px; flex-wrap: wrap;
  margin: 0 0 22px; padding: 14px 14px 14px 20px; border-radius: 24px; background: var(--panel); }
.sent p { margin: 0; flex: 1 1 220px; }
.sent .what { display: block; font-size: 13px; color: var(--ink-soft); }
.sent .name { font: 700 19px var(--display); }
.sent .btns { display: flex; align-items: center; gap: 4px; }
.sent .x { border: 0; background: none; cursor: pointer; color: var(--ink-soft); font-size: 18px; width: 32px; height: 32px; border-radius: 50%; }
.sent .x:hover { background: var(--hover); color: var(--ink); }
select { flex: 1; min-width: 0; padding: 10px 14px; border-radius: 999px; border: 0; background: var(--milk); color: var(--ink); font: 14px var(--sans); box-shadow: inset 0 0 0 1.5px var(--line); }

/* ── Sheets ────────────────────────────────────────────────────────────── */
dialog {
  width: min(460px, calc(100vw - 24px)); max-height: min(660px, calc(100dvh - 48px));
  padding: 0; border: 0; border-radius: 28px; background: var(--sheet); color: var(--ink);
  box-shadow: 0 30px 70px -24px rgba(28, 31, 74, .55);
}
dialog::backdrop { background: rgba(28, 31, 74, .4); backdrop-filter: blur(3px); }
dialog[open] { animation: sheet .3s var(--ease); }
@keyframes sheet { from { transform: translateY(16px); opacity: 0; } }
dialog form { display: flex; flex-direction: column; max-height: inherit; }
.sh-top { padding: 24px 24px 14px; }
.sh-top h2 { margin: 0; font: 800 26px/1.1 var(--display); letter-spacing: -0.03em; }
.sh-top p { margin: 4px 0 16px; color: var(--ink-soft); font-size: 14px; }
.sh-top label { display: block; font-size: 14px; font-weight: 700; margin-bottom: 6px; }
.sh-top input { width: 100%; padding: 12px 18px; border-radius: 999px; border: 0; outline: none; background: var(--milk); color: var(--ink); font: 16px var(--sans); box-shadow: inset 0 0 0 1.5px var(--line); }
.sh-top input:focus { box-shadow: inset 0 0 0 2px var(--ink); }
.sh-top .fine { margin-top: 6px; }
.opts { list-style: none; margin: 0; padding: 4px 12px; overflow-y: auto; border-top: 1.5px solid var(--line); border-bottom: 1.5px solid var(--line); }
.opts label { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 10px; border-radius: 14px; cursor: pointer; font-size: 14px; }
.opts label:hover { background: var(--hover); }
.opts input { accent-color: var(--rhubarb); margin: 0; }
.opts .pc { font-variant-numeric: tabular-nums; font-weight: 700; }
.opts .o { display: flex; align-items: center; gap: 10px; min-width: 0; }
.opts .thumb { flex: none; width: 44px; height: 44px; border-radius: 10px; background: #fff; overflow: hidden; display: grid; place-items: center; }
.opts .thumb img { max-width: 100%; max-height: 100%; object-fit: contain; }
.opts .o-shelf { display: block; font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
.sh-bottom { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 24px 20px; }
.cross { padding: 16px 24px 6px; border-bottom: 1.5px solid var(--line); }
.cross h3, .prefs h3 { margin: 0 0 8px; font-size: 14px; font-weight: 700; }
.preview { list-style: none; margin: 12px 0 10px; padding: 0; font-size: 13px; color: var(--ink-soft); }
.preview li { padding: 3px 0; }
.preview b { color: var(--ink); font-weight: 600; }
.prefs { list-style: none; margin: 0; padding: 4px 24px; overflow-y: auto; }
.prefs li { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 12px 0; border-bottom: 1.5px solid var(--line); }
.prefs li:last-child { border-bottom: 0; }
.prefs p { margin: 2px 0 0; font-size: 13px; color: var(--ink-soft); }
.r-prefs { margin-top: 10px; color: #5b5f86; }
.r-prefs button { border: 0; background: none; padding: 0; font: inherit; color: #d6284b; text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }

@media (max-width: 900px) {
  .bar { position: sticky; padding: max(12px, env(safe-area-inset-top)) 16px 12px;
    background: color-mix(in srgb, var(--milk) 88%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
  .brand { font-size: 18px; padding: 7px 18px 8px; }
  .chips { gap: 6px; }
  .chips button { padding: 6px 12px; font-size: 13.5px; }
  .switch button { padding: 7px 13px; }
  main { display: block; min-height: 0; }
  #left { padding: 20px 16px 36px; max-width: none; }
  h1 { font-size: 44px; margin-bottom: 22px; }
  .dishes { grid-template-columns: 1fr; }
  .dish { font-size: 19px; padding: 13px 2px 12px; }
  .printer { padding: 40px 16px 48px; }
  dialog { margin: auto auto 0; width: 100vw; max-width: 100vw; border-radius: 28px 28px 0 0; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>

<header class="bar">
  <div class="brand">pantryrun</div>
  <nav class="switch" aria-label="What you need">
    <span class="pill" aria-hidden="true"></span>
    <button type="button" data-mode="dinner" aria-pressed="true">Dinner</button>
    <button type="button" data-mode="list" aria-pressed="false">Shopping list</button>
  </nav>
</header>

<main>
  <section id="left"></section>
  <section class="printer" aria-live="polite">
    <div class="slot" aria-hidden="true"></div>
    <div class="feed paper-shadow" id="feed"></div>
    <div class="after" id="after"></div>
  </section>
</main>

<dialog id="hello" aria-labelledby="helloTitle">
  <form method="dialog" id="helloForm">
    <div class="sh-top">
      <h2 id="helloTitle">What’s your name?</h2>
      <p>So we know who tried it, and to keep the dinners you save. No password needed.</p>
      <label for="helloName">Name</label>
      <input id="helloName" name="name" autocomplete="given-name" maxlength="40" required>
    </div>
    <div class="sh-bottom">
      <span></span>
      <button class="btn dark" type="submit">Start</button>
    </div>
  </form>
</dialog>

<dialog id="sheet" aria-labelledby="sheetTitle">
  <form method="dialog" id="sheetForm"></form>
</dialog>

<script>
(() => {
  // ── identity & saved preferences ──────────────────────────────────────
  const store = {
    // Keys were "groceries.*" before the rename to pantryrun; read those so testers keep their name and prefs.
    get(k, fallback) {
      try { return JSON.parse(localStorage.getItem(k) ?? localStorage.getItem(k.replace(/^pantryrun\./, "groceries."))) ?? fallback; }
      catch { return fallback; }
    },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };
  // Who is using it: ?u= in the link wins, otherwise the name asked for on first visit.
  let USER_ID = new URLSearchParams(location.search).get("u") || store.get("pantryrun.name", null);
  const SESSION_ID = (() => {
    try {
      let id = sessionStorage.getItem("sid");
      if (!id) { id = crypto.randomUUID(); sessionStorage.setItem("sid", id); }
      return id;
    } catch { return crypto.randomUUID(); }
  })();

  const state = {
    mode: "dinner",
    recipes: [],         // hand-written classics
    dishes: [],          // NutriData dishes: {id, name, category}
    categories: [],      // {id, name}
    category: store.get("pantryrun.category", "ideas"),
    shown: [],           // dinner ids on screen; kept until the category changes or "Show others"
    mine: [],            // this person's own dinners: {id, name, servings, items}
    editing: null,       // the dinner being written: {id or null, name, servings, items}
    shared: null,        // a dinner someone sent by link: {id "sh-…", token, name, servings, items, saved}
    recipeId: null,
    servings: 2,
    extras: [],          // dinner: anything else for this trip
    extrasOpen: false,   // the field for those is folded away until asked for
    items: [],           // shopping list
    prefs: store.get("pantryrun.prefs", {}),  // {key: {words: [], products: {store: name}}}
    result: null,        // last /basket answer for the current mode
    view: null,          // store whose receipt is showing
    request: 0,
  };

  const $ = (sel, el = document) => el.querySelector(sel);
  const left = $("#left"), feed = $("#feed"), after = $("#after"), sheet = $("#sheet"), sheetForm = $("#sheetForm");
  const euro = new Intl.NumberFormat("et-EE", { style: "currency", currency: "EUR" });
  const num = new Intl.NumberFormat("et-EE", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const amount = (n, unit) => n == null || !unit ? "" : unit === "pcs" ? `${+n.toFixed(1)} tk`
    : n >= 1000 ? `${+(n / 1000).toFixed(2)} ${unit === "g" ? "kg" : "l"}` : `${Math.round(n)} ${unit}`;
  const reduceMotion = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
  const splitItems = text => text.split(",").map(s => s.trim()).filter(s => s.length >= 2);

  async function api(path, body) {
    const res = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
    if (!res.ok) throw new Error(String(res.status));
    return res.json();
  }
  const logEvent = (type, data) => api("/events", { type, data, user_id: USER_ID, session_id: SESSION_ID }).catch(() => {});

  // ── top bar ───────────────────────────────────────────────────────────
  const sw = $(".switch");
  function placePill() {
    const on = $('button[aria-pressed="true"]', sw), pill = $(".pill", sw);
    pill.style.width = on.offsetWidth + "px";
    pill.style.transform = `translateX(${on.offsetLeft - 3}px)`;
  }
  sw.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b || b.dataset.mode === state.mode) return;
    state.mode = b.dataset.mode;
    sw.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
    placePill();
    state.result = null;
    render();
  });
  addEventListener("resize", placePill);

  // ── left side ─────────────────────────────────────────────────────────
  function render() {
    state.request++;  // ignore any answer still on its way for the other mode
    if (state.mode === "dinner" && state.editing) {
      renderEditor();
      idle("Your dinner", "Save it, then pick it to find the store.");
    } else if (state.mode === "dinner") {
      renderDinner();
      state.recipeId ? ask({ fresh: true }) : idle("Pick a dinner", "Your store and shopping list print here.");
    } else {
      renderList();
      idle("Add what you need", "We'll find the one store that has it all.");
    }
  }

  // ── dinners: hand-written classics plus NutriData dishes by category ──
  const DISHES_SHOWN = 6;
  function dinnerById(id) {
    const d = state.dishes.find(x => x.id === id);
    if (d) return d;
    if (state.shared && id === state.shared.id) return state.shared;
    return state.mine.find(x => x.id === id) || state.recipes.find(r => r.id === id);
  }
  function pool(category) {
    if (category === "mine") return state.mine.map(r => r.id);
    if (category === "classics") return state.recipes.map(r => r.id);
    if (category === "ideas") return [...state.recipes, ...state.dishes].map(r => r.id);
    return state.dishes.filter(d => d.category === category).map(d => d.id);
  }
  // A random handful from the category; "Show me others" avoids repeating what was just on screen.
  function shuffle(avoid = []) {
    const ids = pool(state.category);
    if (state.category === "classics" || state.category === "mine") { state.shown = ids; return; }
    const fresh = ids.filter(id => !avoid.includes(id));
    const from = fresh.length >= DISHES_SHOWN ? fresh : ids;
    const picked = [...from].sort(() => Math.random() - 0.5).slice(0, DISHES_SHOWN);
    // Keep the chosen dinner on screen so its button stays pressed.
    if (state.recipeId && ids.includes(state.recipeId) && !picked.includes(state.recipeId)) picked[0] = state.recipeId;
    state.shown = picked;
  }
  function shownDinners() {
    if (!state.shown.length) shuffle();
    return state.shown.map(dinnerById).filter(Boolean);
  }

  function renderDinner() {
    left.innerHTML = `
      <h1>Dinner <span class="for">for <span class="stepper" role="group" aria-label="Number of people">
          <button type="button" data-step="-1" aria-label="Fewer people">−</button>
          <output id="servings">${state.servings}</output>
          <button type="button" data-step="1" aria-label="More people">+</button>
        </span></span> tonight</h1>
      ${state.shared ? `<div class="sent">
        <p><span class="what">A dinner sent to you</span><span class="name" lang="et">${esc(state.shared.name)}</span></p>
        <span class="btns">${state.shared.saved ? `<span class="fine">Saved to Mine</span>`
          : `<button type="button" class="btn quiet" id="saveShared">Save to my dinners</button>`}
          <button type="button" class="x" id="dropShared" aria-label="Close">×</button></span>
      </div>` : ""}
      <div class="chips cats" role="group" aria-label="Kind of dinner">${[
        { id: "ideas", name: "Ideas" }, { id: "classics", name: "Classics" }, { id: "mine", name: "Mine" }, ...state.categories,
      ].map(c => `<button type="button" data-cat="${esc(c.id)}" aria-pressed="${c.id === state.category}">${esc(c.name)}</button>`).join("")}</div>
      ${state.category === "mine" && !state.mine.length ? `<p class="empty">Write down a dinner you cook often. Type what you
        buy for it once, with amounts if you like, and pantryrun finds the store each time.</p>` : ""}
      <ul class="dishes">${shownDinners().map(r => `
        <li${r.id.startsWith("my-") ? ` class="mine"` : ""}><button type="button" class="dish" data-id="${esc(r.id)}" aria-pressed="${r.id === state.recipeId}">
          <span lang="et">${esc(r.name)}</span></button>${r.id.startsWith("my-")
          ? `<button type="button" class="link" data-edit-dinner="${esc(r.id)}" aria-label="Edit ${esc(r.name)}">Edit</button>` : ""}</li>`).join("")}
      </ul>
      <div class="more">${state.category === "mine" ? `<button type="button" class="btn quiet" id="newDinner">New dinner</button>`
        : state.category === "classics" ? ""
        : `<button type="button" class="link" id="shuffle">Show me others</button>`}
        ${shownDinners().some(r => r.id.startsWith("nd-")) ? `<span class="fine">Dishes from NutriData, Tervise Arengu Instituut</span>` : ""}</div>
      <div class="extras">${state.extrasOpen || state.extras.length ? `
        <h2>Anything else on the way?</h2>
        <form class="field" id="add" autocomplete="off">
          <input id="item" placeholder="kohv, leib, banaanid 1kg" aria-label="Add more items" enterkeyhint="done">
          <button class="btn quiet" type="submit">Add</button>
        </form>
        ${state.extras.length ? `<ul class="tags">${state.extras.map((it, i) => `
          <li>${itemButton(it, i)}<button type="button" data-remove="${i}" aria-label="Remove ${esc(it)}">×</button></li>`).join("")}</ul>` : ""}`
        : `<button type="button" class="open-extras" id="openExtras"><span aria-hidden="true">+</span>Anything else on the way?</button>`}
      </div>`;
    if ($("#add")) bindAdd(state.extras, () => { renderDinner(); if (state.recipeId) ask(); });
  }

  // ── my dinners: write one from scratch ──
  function renderEditor() {
    const d = state.editing;
    left.innerHTML = `
      <div class="editor">
        <h1>${d.id ? "Edit dinner" : "New dinner"}</h1>
        <div class="sub">For
          <span class="stepper" role="group" aria-label="Number of people the amounts are for">
            <button type="button" data-dstep="-1" aria-label="Fewer people">−</button>
            <output id="dservings">${d.servings}</output>
            <button type="button" data-dstep="1" aria-label="More people">+</button>
          </span> people</div>
        <label for="dname">Name</label>
        <input id="dname" class="name" maxlength="80" value="${esc(d.name)}" placeholder="Pühapäeva pasta" autocomplete="off">
        <h2>What you buy for it</h2>
        <p class="fine">Amounts are for ${d.servings} ${d.servings === 1 ? "person" : "people"} and scale with how many you cook for.</p>
        <form class="field" id="add" autocomplete="off">
          <input id="item" placeholder="hakkliha 500g, sibul, 2 purustatud tomatid" aria-label="Add things to buy" enterkeyhint="done">
          <button class="btn quiet" type="submit">Add</button>
        </form>
        <ul class="items">${d.items.length ? d.items.map((it, i) => `
          <li>${itemButton(it, i)}<button type="button" data-remove="${i}" aria-label="Remove ${esc(it)}">×</button></li>`).join("")
          : `<li class="none">Nothing to buy yet.</li>`}
        </ul>
        <div class="actions">
          <button class="btn dark" id="saveDinner" type="button">Save dinner</button>
          <button class="btn quiet" id="cancelDinner" type="button">Cancel</button>
          ${d.id ? `<button class="link" id="deleteDinner" type="button">Delete</button>` : ""}
        </div>
        <p class="error" id="dinnerError" role="alert"></p>
      </div>`;
    $("#dname").addEventListener("input", e => { d.name = e.target.value; });
    bindAdd(d.items, renderEditor);
  }

  function editDinner(id) {
    const m = id && state.mine.find(x => x.id === id);
    state.editing = m ? { id: m.id, name: m.name, servings: m.servings, items: [...m.items] }
                      : { id: null, name: "", servings: state.servings, items: [] };
    render();
    $(m ? "#item" : "#dname").focus();
  }

  async function saveDinner() {
    const d = state.editing;
    const body = { user_id: USER_ID, name: d.name, servings: d.servings, items: d.items };
    try {
      const res = await fetch(d.id ? `/my-dinners/${encodeURIComponent(d.id)}` : "/my-dinners", {
        method: d.id ? "PUT" : "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      const saved = await res.json();
      if (!res.ok) { $("#dinnerError").textContent = saved.detail || "Couldn't save the dinner. Try again."; return; }
      state.mine = [...state.mine.filter(x => x.id !== saved.id), saved].sort((a, b) => a.name.localeCompare(b.name));
      state.editing = null;
      state.category = "mine"; store.set("pantryrun.category", "mine"); state.shown = [];
      state.recipeId = saved.id;
      render();
    } catch {
      $("#dinnerError").textContent = "Couldn't reach pantryrun. Check your connection, then try again.";
    }
  }

  async function deleteDinner() {
    const d = state.editing;
    if (!confirm(`Delete "${d.name}"?`)) return;
    const res = await fetch(`/my-dinners/${encodeURIComponent(d.id)}?user_id=${encodeURIComponent(USER_ID)}`, { method: "DELETE" });
    if (!res.ok && res.status !== 404) { $("#dinnerError").textContent = "Couldn't delete the dinner. Try again."; return; }
    state.mine = state.mine.filter(x => x.id !== d.id);
    if (state.recipeId === d.id) state.recipeId = null;
    state.editing = null; state.shown = [];
    render();
  }

  // An item on a list; tapping it turns it into a text field, e.g. to add an amount.
  const itemButton = (it, i) => `<button type="button" class="it" data-edit="${i}" aria-label="Change ${esc(it)}">${esc(it)}</button>`;

  // The list being edited on screen and what to do after it changes.
  function itemContext() {
    if (state.mode === "dinner" && state.editing) return { list: state.editing.items, after: renderEditor };
    if (state.mode === "dinner") return { list: state.extras, after: () => { renderDinner(); if (state.recipeId) ask(); } };
    return { list: state.items, after: () => {
      renderList();
      if (!state.items.length) idle("Add what you need", "We'll find the one store that has it all.");
      else if (state.result) ask();
    } };
  }

  function editItem(button) {
    const { list, after } = itemContext();
    const i = +button.dataset.edit;
    const field = document.createElement("input");
    field.className = "edit"; field.value = list[i]; field.setAttribute("aria-label", "Change item");
    button.replaceWith(field);
    field.focus(); field.select();
    let done = false;
    const finish = keep => {
      if (done) return;
      done = true;
      const text = field.value.trim().replace(/\s+/g, " ");
      if (keep && text !== list[i]) {
        if (text) list[i] = text; else list.splice(i, 1);
        logEvent("item_changed", { mode: state.mode, to: text || null });
      }
      after();
    };
    field.addEventListener("keydown", e => {
      if (e.key === "Enter") { e.preventDefault(); finish(true); }
      if (e.key === "Escape") { e.preventDefault(); finish(false); }
    });
    field.addEventListener("blur", () => finish(true));
  }

  function renderList() {
    left.innerHTML = `
      <h1>What do you need?</h1>
      <div class="sub">Type a few things, separated by commas. Add an amount if you like.</div>
      <form class="field" id="add" autocomplete="off">
        <input id="item" placeholder="piim, paprika 600g, 2 leib" aria-label="Add items" enterkeyhint="done">
        <button class="btn quiet" type="submit">Add</button>
      </form>
      <ul class="items">${state.items.length ? state.items.map((it, i) => `
        <li>${itemButton(it, i)}<button type="button" data-remove="${i}" aria-label="Remove ${esc(it)}">×</button></li>`).join("")
        : `<li class="none">Nothing on the list yet.</li>`}
      </ul>
      <button class="btn dark" id="find" type="button" ${state.items.length ? "" : "disabled"}>Find the store</button>`;
    bindAdd(state.items, () => { renderList(); if (state.result) ask(); });
  }

  function bindAdd(list, onChange) {
    const form = $("#add"), input = $("#item");
    const box = document.createElement("ul");
    box.className = "suggest"; box.id = "suggest"; box.setAttribute("role", "listbox"); box.hidden = true;
    form.append(box);
    Object.entries({ role: "combobox", "aria-autocomplete": "list", "aria-controls": "suggest", "aria-expanded": "false" })
      .forEach(([k, v]) => input.setAttribute(k, v));
    let shown = [], active = -1;

    function add(text, via, typed) {
      const added = splitItems(text).filter(it => !list.includes(it));
      list.push(...added);
      if (added.length) logEvent("item_added", { items: added, via, typed, mode: state.mode });
      onChange();
      $("#item").focus();  // the form was redrawn
    }
    function show(words) {
      shown = words; active = -1;
      box.innerHTML = words.map((v, i) => `<li role="option" id="sg${i}" aria-selected="false" data-i="${i}">
        <span>${esc(v.w)}</span>${v.s ? `<span class="s-shelf">${esc(v.s.toLowerCase())}</span>` : ""}</li>`).join("");
      box.hidden = !words.length;
      input.setAttribute("aria-expanded", String(!box.hidden));
      input.removeAttribute("aria-activedescendant");
    }
    function move(step) {
      if (!shown.length) return;
      active = (active + step + shown.length + 2) % (shown.length + 1) - 1;  // -1 = back to what was typed
      box.querySelectorAll("li").forEach((li, i) => li.setAttribute("aria-selected", i === active));
      active < 0 ? input.removeAttribute("aria-activedescendant") : input.setAttribute("aria-activedescendant", `sg${active}`);
    }
    function pick(i) {
      const parts = input.value.split(",");
      const typed = parts.pop().trim();
      const { lead, trail } = splitQty(typed);  // keep "600g" in "600g pap" → "600g paprika"
      add([...parts, lead + shown[i].w + trail].join(","), "suggestion", typed);
    }

    input.addEventListener("focus", loadVocab, { once: true });
    input.addEventListener("input", () => show(suggest(splitQty(input.value.split(",").pop().trim()).name)));
    input.addEventListener("keydown", e => {
      if (box.hidden) return;
      if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); move(e.key === "ArrowDown" ? 1 : -1); }
      else if (e.key === "Enter" && active >= 0) { e.preventDefault(); pick(active); }
      else if (e.key === "Escape") show([]);
    });
    input.addEventListener("blur", () => setTimeout(() => show([]), 150));
    box.addEventListener("pointerdown", e => e.preventDefault());  // keep focus in the input
    box.addEventListener("click", e => { const li = e.target.closest("li"); if (li) pick(+li.dataset.i); });
    form.addEventListener("submit", e => { e.preventDefault(); add(input.value, "typed"); });
  }

  // An amount typed before or after the name ("600g paprika", "paprika 600 g", "2 piim"); same units as the server.
  const QTY = String.raw`\d+(?:[.,]\d+)?\s*(?:kg|g|dl|cl|ml|l|tk|x|×)?`;
  function splitQty(text) {
    let m = text.match(new RegExp(String.raw`^(${QTY}\s+)(\S.*)$`, "i"));
    if (m) return { lead: m[1], name: m[2], trail: "" };
    m = text.match(new RegExp(String.raw`^(.*\S)(\s+${QTY})$`, "i"));
    if (m) return { lead: "", name: m[1], trail: m[2] };
    return { lead: "", name: text, trail: "" };
  }

  // Product words from the store catalogs (scripts/build_vocab.py): [word, products, shelf], most used first.
  let VOCAB = null, vocabLoading = null;
  function loadVocab() {
    vocabLoading ||= fetch("/vocab.json").then(r => r.json())
      .then(v => { VOCAB = v.map(([w, n, s]) => ({ w, s, f: fold(w) })); })
      .then(() => { const el = document.activeElement; if (el?.id === "item" && el.value) el.dispatchEvent(new Event("input")); })
      .catch(() => { vocabLoading = null; });
  }
  // Edit distance, giving up past `max` (typos like "maapäklivõi").
  function within(a, b, max) {
    if (Math.abs(a.length - b.length) > max) return false;
    let prev = Array.from({ length: b.length + 1 }, (_, j) => j);
    for (let i = 1; i <= a.length; i++) {
      const row = [i];
      for (let j = 1; j <= b.length; j++) row[j] = Math.min(prev[j] + 1, row[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      if (Math.min(...row) > max) return false;
      prev = row;
    }
    return prev[b.length] <= max;
  }
  // Words that start with what was typed, then words containing it, then close typos.
  function suggest(text) {
    const q = fold(text.trim());
    if (!VOCAB || q.length < 2) return [];
    const starts = [], inside = [], typos = [];
    for (const v of VOCAB) {
      if (v.f.startsWith(q)) starts.push(v);
      else if (q.length >= 3 && v.f.includes(q)) inside.push(v);
      else if (q.length >= 5 && within(v.f, q, 2)) typos.push(v);
    }
    return [...starts, ...inside, ...typos].slice(0, 6);
  }

  left.addEventListener("click", e => {
    const dish = e.target.closest(".dish");
    if (dish) {
      state.recipeId = dish.dataset.id;
      left.querySelectorAll(".dish").forEach(d => d.setAttribute("aria-pressed", d === dish));
      ask({ fresh: true });
      return;
    }
    const cat = e.target.closest("[data-cat]");
    if (cat) {
      state.category = cat.dataset.cat;
      store.set("pantryrun.category", state.category);
      state.shown = [];
      renderDinner();
      logEvent("dinner_category", { category: state.category });
      return;
    }
    if (e.target.closest("#shuffle")) {
      shuffle(state.shown);
      renderDinner();
      logEvent("dinner_shuffle", { category: state.category });
      return;
    }
    const step = e.target.closest("[data-step]");
    if (step) {
      state.servings = Math.min(8, Math.max(1, state.servings + +step.dataset.step));
      $("#servings").textContent = state.servings;
      clearTimeout(state.stepTimer);
      if (state.recipeId) state.stepTimer = setTimeout(ask, 350);
      return;
    }
    const rm = e.target.closest("[data-remove]");
    if (rm) {
      const { list, after } = itemContext();
      list.splice(+rm.dataset.remove, 1);
      after();
      return;
    }
    const edit = e.target.closest("[data-edit]");
    if (edit) { editItem(edit); return; }
    const dstep = e.target.closest("[data-dstep]");
    if (dstep) {
      state.editing.servings = Math.min(12, Math.max(1, state.editing.servings + +dstep.dataset.dstep));
      renderEditor();
      return;
    }
    const editD = e.target.closest("[data-edit-dinner]");
    if (editD) { editDinner(editD.dataset.editDinner); return; }
    if (e.target.closest("#newDinner")) { editDinner(null); return; }
    if (e.target.closest("#openExtras")) { state.extrasOpen = true; renderDinner(); $("#item").focus(); return; }
    if (e.target.closest("#saveShared")) { saveShared(); return; }
    if (e.target.closest("#dropShared")) {
      if (state.recipeId === state.shared.id) { state.recipeId = null; idle("Pick a dinner", "Your store and shopping list print here."); }
      state.shared = null;
      history.replaceState(null, "", location.pathname + location.search.replace(/[?&]dinner=[^&]*/, "").replace(/^&/, "?"));
      renderDinner();
      return;
    }
    if (e.target.closest("#saveDinner")) { saveDinner(); return; }
    if (e.target.closest("#cancelDinner")) { state.editing = null; render(); return; }
    if (e.target.closest("#deleteDinner")) { deleteDinner(); return; }
    if (e.target.closest("#find")) ask({ fresh: true });
  });

  // ── receipt states ────────────────────────────────────────────────────
  function print(html, animate) {
    feed.innerHTML = `<div class="receipt">${html}</div>`;
    if (animate && !reduceMotion()) feed.firstElementChild.classList.add("printing");
  }
  function reveal() {
    const top = $(".printer").getBoundingClientRect().top;
    if (top > innerHeight * 0.55) scrollTo({ top: scrollY + top - 70, behavior: reduceMotion() ? "auto" : "smooth" });
  }
  function idle(title, text) {
    state.result = null;
    print(`<div class="waiting"><b>${esc(title)}</b>${esc(text)}</div>`, false);
    after.innerHTML = "";
  }
  function printing(text) {
    print(`<div class="waiting"><b>${esc(text)}</b>Comparing prices<span class="dots"><i>.</i><i>.</i><i>.</i></span></div>`, false);
    after.innerHTML = "";
    reveal();
  }
  function failed(retry) {
    feed.classList.remove("busy");
    print(`<div class="waiting"><b>The stores didn't answer</b>Check your connection, then try again.</div>`, false);
    after.innerHTML = `<button class="btn quiet" type="button" id="retry" style="width:100%">Try again</button>`;
    $("#retry").onclick = () => retry();
  }

  // What to show next to the item name. Recipe lines say how much the recipe needs ("need 4 tk");
  // the pack comes from the product name. List items have no amount of their own, except loose
  // goods priced by weight, where the price only makes sense with the weight we assumed.
  function lineAmount(l) {
    if (l.asked) return l.asked;  // typed with the item: "600 g", "2 packs"
    if (l.need == null) return "";
    if (!l.extra) return `need ${amount(l.need, l.unit)}`;
    return l.packs == null ? amount(l.need, l.unit) : "";
  }

  const shortDate = iso => { const [, m, d] = iso.split("-"); return `${+d}.${m}`; };
  const percentOff = (regular, cost) => Math.round((1 - cost / regular) * 100);

  // The store shelf says what an unclear product is ("… NATTY ORIGINAL, 333g · magusad hoidised");
  // left out when it only repeats the item ("banaan · banaan").
  const shelfNote = l => l.shelf && !fold(l.shelf).includes(fold(l.label).slice(0, 4)) ? l.shelf.toLowerCase() : "";

  function line(l) {
    const tag = l.substitute ? "swap" : (l.pinned || l.preferred) ? "your pick" : "";
    const amt = lineAmount(l);
    const onSale = l.regular_cost && l.regular_cost > l.cost;
    const off = onSale ? `<span class="r-off">−${percentOff(l.regular_cost, l.cost)}%${l.deal_until ? ` until ${shortDate(l.deal_until)}` : ""}</span>` : "";
    const notes = [
      l.card_cost && l.card_cost < l.cost ? `${num.format(l.card_cost)} with a loyalty card` : "",
      l.deal || "",
    ].filter(Boolean);
    return `<li><button type="button" class="r-line" data-key="${esc(l.key)}" aria-label="Choose another ${esc(l.label)}">
      <span class="n">${esc(l.label)}${amt ? ` <span class="amt">${esc(amt)}</span>` : ""}${off}${tag ? `<span class="r-tag">${tag}</span>` : ""}</span>
      <span class="c">${onSale ? `<s>${num.format(l.regular_cost)}</s>` : ""}${num.format(l.cost)}</span>
      <span class="p">${esc(l.product)}${shelfNote(l) ? `<span class="shelf"> · ${esc(shelfNote(l))}</span>` : ""}</span>
      ${notes.length ? `<span class="d">${esc(notes.join(". "))}</span>` : ""}</button></li>`;
  }

  // Draw the receipt for one store of the current result.
  function showReceipt(storeName, animate) {
    const res = state.result;
    const best = res.baskets[0];
    const b = res.baskets.find(x => x.store === storeName) || best;
    state.view = b.store;
    const isBest = b.store === best.store;
    const main = b.lines.filter(l => !l.extra), extra = b.lines.filter(l => l.extra);
    const delta = !isBest && (b.missing.length > best.missing.length
      ? `${cap(best.store)} has more of your list`
      : `${euro.format(b.total_price - best.total_price)} more than ${cap(best.store)}`);
    const n = res.items.length;
    const what = res.recipe ? `${res.recipe.name} for ${res.servings}` : `Your list of ${n}`;

    print(`
      <div class="r-center">
        <div class="r-go">${isBest ? "Go to" : "At"}</div>
        <div class="r-store">${esc(cap(b.store))}</div>
        <div class="r-what">${esc(what)}</div>
        ${delta ? `<div class="r-delta">${esc(delta)}</div>` : ""}
      </div>
      <hr class="r-rule">
      <ul class="r-items">${main.map(line).join("")}</ul>
      ${res.recipe && extra.length ? `<div class="r-head">Also</div>` : ""}
      ${extra.length ? `<ul class="r-items">${extra.map(line).join("")}</ul>` : ""}
      ${b.missing.length ? `<div class="r-missing">Not in the e-shop: ${b.missing.map(esc).join(", ")}</div>` : ""}
      <div class="r-hint">Tap an item to choose another.</div>
      <hr class="r-rule">
      <div class="r-total"><span>Total</span><span>${euro.format(b.total_price)}</span></div>
      ${b.savings > 0 ? `<div class="r-save"><span>You save</span><span>${euro.format(b.savings)}</span></div>` : ""}
      ${b.card_savings > 0 ? `<div class="r-card">${euro.format(b.card_savings)} less with a loyalty card</div>` : ""}
      ${pantryNote(res)}
      ${prefsNote(b)}
      ${res.baskets.length > 1 ? `<hr class="r-rule"><div class="r-head" style="margin-top:0">Compare stores</div>
        <ul class="stores">${res.baskets.map(o => `<li><button type="button" data-store="${esc(o.store)}" aria-current="${o.store === b.store}">
          <span class="s">${esc(cap(o.store))}</span><span class="v">${euro.format(o.total_price)}${o.missing.length ? ` (${o.missing.length} missing)` : ""}</span></button></li>`).join("")}</ul>` : ""}
    `, animate);

    after.innerHTML = `
      <div class="actions" id="fb">
        <button class="btn go" type="button" data-fb="accept">I'll go to ${esc(cap(b.store))}</button>
        <button class="btn quiet" type="button" data-fb="reject">Not for me</button>
      </div>
      <div class="small">
        <button class="link" type="button" id="wrong">Wrong product?</button>
        <span class="fine">E-shop prices. In store they can differ a little.</span>
      </div>
      <div id="report"></div>
      ${res.recipe ? `<div class="share"><button class="btn quiet" type="button" id="share">Send this dinner to someone</button>
        <span class="fine" id="shareNote" role="status"></span></div>` : ""}`;
    if (res.recipe) $("#share").onclick = () => shareDinner(res.recipe);

    const feedback = { mission: state.mode, recipe_id: res.recipe?.id ?? null, servings: res.servings, items: res.items,
                       store: b.store, recommended_store: best.store, total_price: b.total_price, result_id: res.id };
    after.querySelectorAll("[data-fb]").forEach(btn => btn.onclick = () => {
      const accepted = btn.dataset.fb === "accept";
      logEvent(btn.dataset.fb, feedback);
      $("#fb").innerHTML = `<p class="thanks">${accepted ? "Have a good trip." : "Thanks. We'll use that to improve."}</p>`;
      if (accepted) feed.firstElementChild.insertAdjacentHTML("beforeend", `<div class="stamp">Going</div>`);
    });
    $("#wrong").onclick = () => {
      $("#report").innerHTML = `<div class="report">
        <select id="wrongItem" aria-label="Which product is wrong">${b.lines.map((l, i) => `<option value="${i}">${esc(l.label)}: ${esc(l.product)}</option>`).join("")}</select>
        <button class="btn quiet" type="button" id="sendReport">Report</button></div>`;
      $("#sendReport").onclick = () => {
        const l = b.lines[+$("#wrongItem").value];
        logEvent("wrong_product", { store: b.store, key: l.key, ingredient: l.ingredient, product: l.product, mission: state.mode, recipe_id: res.recipe?.id ?? null });
        $("#report").innerHTML = `<p class="thanks" style="margin-top:12px">Reported. We'll fix it.</p>`;
      };
    };
  }

  // A link to this dinner, priced for whoever opens it. On phones the share sheet opens; elsewhere it's copied.
  async function shareDinner(recipe) {
    const note = $("#shareNote");
    try {
      const { path } = await api("/shares", { recipe_id: recipe.id, user_id: USER_ID });
      const url = location.origin + path;
      if (navigator.share && matchMedia("(pointer: coarse)").matches) {
        await navigator.share({ title: recipe.name, text: `${recipe.name}: here's where to shop for it`, url }).catch(() => {});
        return;
      }
      try {
        await navigator.clipboard.writeText(url);
        note.textContent = "Link copied. Paste it in a message.";
      } catch {  // no clipboard access: show the link to copy by hand
        note.insertAdjacentHTML("afterend", `<input readonly value="${esc(url)}" aria-label="Link to this dinner">`);
        note.textContent = "Copy this link:";
        note.nextElementSibling.select();
      }
    } catch {
      note.textContent = "Couldn't make a link. Try again.";
    }
  }

  async function saveShared() {
    const d = state.shared;
    try {
      const saved = await api("/my-dinners", { user_id: USER_ID, name: d.name, servings: d.servings, items: d.items, from_share: d.token });
      state.mine = [...state.mine, saved].sort((a, b) => a.name.localeCompare(b.name));
      d.saved = true;
      renderDinner();
    } catch {
      $("#saveShared").textContent = "Couldn't save. Try again";
    }
  }

  feed.addEventListener("click", e => {
    const s = e.target.closest("[data-store]");
    if (s && s.dataset.store !== state.view) {
      logEvent("view_store", { store: s.dataset.store, recommended_store: state.result.baskets[0].store, result_id: state.result.id });
      showReceipt(s.dataset.store, true);
      return;
    }
    if (e.target.closest("#editPrefs")) { openPrefs(); return; }
    const pantry = e.target.closest("[data-pantry]");
    if (pantry) {
      state.extras.push(pantry.dataset.pantry);
      logEvent("add_pantry", { item: pantry.dataset.pantry, recipe_id: state.result?.recipe?.id ?? null });
      renderDinner();
      ask();
      return;
    }
    const l = e.target.closest(".r-line");
    if (l) openSheet(l.dataset.key);
  });

  // ── choose another product / remember a preference ───────────────────
  // Same spelling-tolerant comparison as the server (core/scoring.py fold).
  const fold = t => t.toLowerCase().replace(/(?<=[gctp])h/g, "").replace(/(.)\1+/g, "$1");
  const matches = (product, words) => words.every(w => fold(product).includes(fold(w)));

  // Words from a product name that could describe a preference: brand, type, fat %.
  // Pack sizes and the ingredient's own name are left out.
  function nameWords(product, label) {
    const skip = new Set(fold(label).split(/\s+/));
    const seen = new Set();
    return product.split(/[\s,()/]+/)
      .map(w => w.replace(/^[.\-]+|[.\-]+$/g, ""))
      .filter(w => w.length >= 3 || /%/.test(w))
      .filter(w => !/^\d+([.,]\d+)?(g|kg|ml|l|cl|tk|x\d+.*)?$/i.test(w) && !/^\d+x\d+/i.test(w))
      .filter(w => !skip.has(fold(w)))
      .filter(w => { const k = fold(w); if (seen.has(k)) return false; seen.add(k); return true; })
      .slice(0, 6)
      .map(w => /%/.test(w) ? w : w.toLowerCase());
  }

  function savePrefs(key, change) {
    store.set("pantryrun.prefs", state.prefs);
    logEvent("preference", { key, change, pref: state.prefs[key] || null });
  }

  function openSheet(key) {
    const res = state.result;
    const b = res.baskets.find(x => x.store === state.view);
    const l = b.lines.find(x => x.key === key);
    const old = state.prefs[key] || {};
    const others = res.baskets.filter(x => x.store !== b.store)
      .map(x => ({ store: x.store, line: x.lines.find(y => y.key === key) }));
    let chosen = l.product;
    let words = [...(old.words || [])];
    const photos = l.options.some(o => o.image);

    function cross() {
      const differs = chosen !== l.options[0].product || words.length;
      if (!differs) return `<div class="cross"><p class="fine" style="margin:0 0 10px">The other stores keep their cheapest ${esc(l.label.toLowerCase())}.</p></div>`;
      const suggestions = [...new Set([...words, ...nameWords(chosen, l.label)])];
      const rows = others.map(o => {
        if (!o.line) return `<li><b>${esc(cap(o.store))}:</b> doesn't sell it</li>`;
        if (!words.length) return `<li><b>${esc(cap(o.store))}:</b> keeps the cheapest, ${esc(o.line.options[0].product)}</li>`;
        const hit = o.line.options.find(x => matches(x.product, words));
        return hit
          ? `<li><b>${esc(cap(o.store))}:</b> ${esc(hit.product)}, ${num.format(hit.cost)} €</li>`
          : `<li><b>${esc(cap(o.store))}:</b> nothing matches, so the cheapest stays</li>`;
      }).join("");
      return `<div class="cross">
        <h3>At the other stores, look for</h3>
        <div class="chips">${suggestions.map(w => `<button type="button" data-word="${esc(w)}" aria-pressed="${words.some(x => fold(x) === fold(w))}">${esc(w)}</button>`).join("")}</div>
        <ul class="preview">${rows}</ul>
      </div>`;
    }

    sheetForm.innerHTML = `
      <div class="sh-top">
        <h2 id="sheetTitle">${esc(l.label)}</h2>
        <p style="margin-bottom:0">${esc(cap(lineAmount(l) ? lineAmount(l) + " at " : "At "))}${esc(cap(b.store))}. Pick the one you want.</p>
      </div>
      <ul class="opts">${l.options.map((o, i) => `
        <li><label><input type="radio" name="opt" value="${i}" ${o.product === chosen ? "checked autofocus" : ""}>
          <span class="o">${photos ? `<span class="thumb">${o.image ? `<img src="${esc(o.image)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : ""}</span>` : ""}
            <span>${esc(o.product)}${o.deal ? ` <span class="fine">${esc(o.deal)}</span>` : ""}${o.shelf ? `<span class="o-shelf">${esc(o.shelf.toLowerCase())}</span>` : ""}</span></span>
          <span class="pc">${o.regular_cost && o.regular_cost > o.cost ? `<s>${num.format(o.regular_cost)}</s>` : ""}${num.format(o.cost)}</span></label></li>`).join("")}
      </ul>
      <div id="cross">${cross()}</div>
      <div class="sh-bottom">
        <button class="link" value="reset" type="submit">Back to cheapest</button>
        <span style="display:flex;gap:8px">
          <button class="btn quiet" value="cancel" type="submit">Cancel</button>
          <button class="btn dark" value="apply" type="submit">Done</button>
        </span>
      </div>`;

    sheetForm.onchange = e => {
      if (e.target.name !== "opt") return;
      chosen = l.options[+e.target.value].product;
      words = words.filter(w => matches(chosen, [w]));  // drop words the new pick doesn't have
      $("#cross", sheetForm).innerHTML = cross();
    };
    sheetForm.onclick = e => {
      const chip = e.target.closest("[data-word]");
      if (!chip) return;
      const w = chip.dataset.word;
      words = words.some(x => fold(x) === fold(w)) ? words.filter(x => fold(x) !== fold(w)) : [...words, w];
      $("#cross", sheetForm).innerHTML = cross();
    };

    sheet.returnValue = "";
    sheet.onclose = () => {
      const action = sheet.returnValue;
      if (action !== "apply" && action !== "reset") return;
      const before = JSON.stringify(state.prefs[key] || {});
      if (action === "reset") {
        delete state.prefs[key];
      } else {
        const next = { label: l.label, words, products: { ...(old.products || {}) } };
        if (chosen !== l.options[0].product) next.products[b.store] = chosen;
        else delete next.products[b.store];
        if (!next.words.length && !Object.keys(next.products).length) delete state.prefs[key];
        else state.prefs[key] = next;
      }
      if (JSON.stringify(state.prefs[key] || {}) === before) return;
      savePrefs(key, action);
      ask({ keepView: true });
    };
    sheet.showModal();
  }

  // ── what preferences are saved, and removing them ─────────────────────
  function prefLabel(key) {
    return state.prefs[key]?.label || (key.startsWith("text:") ? key.slice(5) : cap(key.replace(/_/g, " ")));
  }
  function describePref(p) {
    const parts = [];
    if (p.words?.length) parts.push(`In every store: products with “${p.words.join("”, “")}”`);
    for (const [s, prod] of Object.entries(p.products || {})) parts.push(`At ${cap(s)}: ${prod}`);
    return parts;
  }

  // Items the recipe assumes you have. Tapping one adds it to this trip.
  function pantryNote(res) {
    const left = (res.recipe?.pantry || []).filter(p => !state.extras.some(e => e.toLowerCase() === p.toLowerCase()));
    if (!left.length) return "";
    return `<div class="r-note r-pantry">Have at home: ${left.map(p => `<button type="button" data-pantry="${esc(p)}" aria-label="Add ${esc(p)} to the trip">${esc(p)}</button>`).join(", ")}. Missing one? Tap it to add it.</div>`;
  }

  function prefsNote(b) {
    const keys = Object.keys(state.prefs);
    if (!keys.length) return "";
    const used = b.lines.filter(l => l.pinned || l.preferred).map(l => l.label);
    const text = used.length ? `Using your preferences for ${used.join(", ")}.` : `You have ${keys.length} saved ${keys.length === 1 ? "preference" : "preferences"}.`;
    return `<div class="r-prefs">${esc(text)} <button type="button" id="editPrefs">Edit preferences</button></div>`;
  }

  function openPrefs() {
    let changed = false;
    const draw = () => {
      const keys = Object.keys(state.prefs);
      sheetForm.innerHTML = `
        <div class="sh-top">
          <h2 id="sheetTitle">Your preferences</h2>
          <p style="margin-bottom:0">${keys.length ? "These replace the cheapest product when they match." : "No preferences saved. Tap an item on the receipt to pick another product."}</p>
        </div>
        ${keys.length ? `<ul class="prefs">${keys.map(k => `<li>
          <div><b>${esc(prefLabel(k))}</b>${describePref(state.prefs[k]).map(t => `<p>${esc(t)}</p>`).join("")}</div>
          <button class="btn quiet" type="button" data-remove-pref="${esc(k)}">Remove</button></li>`).join("")}</ul>` : ""}
        <div class="sh-bottom">
          ${keys.length > 1 ? `<button class="link" type="button" id="removeAll">Remove all</button>` : "<span></span>"}
          <button class="btn dark" value="close" type="submit">Done</button>
        </div>`;
    };
    draw();
    sheetForm.onchange = null;
    sheetForm.onclick = e => {
      const one = e.target.closest("[data-remove-pref]");
      if (one) { delete state.prefs[one.dataset.removePref]; savePrefs(one.dataset.removePref, "remove"); changed = true; draw(); }
      if (e.target.closest("#removeAll")) {
        for (const k of Object.keys(state.prefs)) { delete state.prefs[k]; savePrefs(k, "remove_all"); }
        changed = true; draw();
      }
    };
    sheet.returnValue = "";
    sheet.onclose = () => { if (changed && state.result) ask({ keepView: true }); };
    sheet.showModal();
  }

  // ── asking for baskets ────────────────────────────────────────────────
  async function ask({ fresh = false, keepView = false } = {}) {
    const dinner = state.mode === "dinner";
    const items = dinner ? state.extras : state.items;
    if (dinner ? !state.recipeId : !items.length) return;
    const req = ++state.request;
    const view = keepView ? state.view : null;

    if (fresh || !state.result) {
      const recipe = dinnerById(state.recipeId);
      printing(dinner ? `${recipe.name} for ${state.servings}` : `${items.length} ${items.length === 1 ? "thing" : "things"} on your list`);
    } else {
      feed.classList.add("busy");
    }
    try {
      const res = await api("/basket", {
        recipe_id: dinner ? state.recipeId : null, servings: state.servings, items,
        prefs: state.prefs, user_id: USER_ID, session_id: SESSION_ID,
      });
      if (req !== state.request) return;
      feed.classList.remove("busy");
      if (!res.baskets.length || !res.baskets[0].lines.length) {
        idle("No store had these", "Try simpler words, like piim or leib.");
        return;
      }
      const animate = fresh || !state.result;
      state.result = { ...res, id: crypto.randomUUID() };
      showReceipt(view && res.baskets.some(b => b.store === view) ? view : res.store, animate);
      if (animate) reveal();
    } catch {
      if (req === state.request) failed(() => ask({ fresh: true }));
    }
  }

  // A name is required before using the app.
  function askName() {
    const hello = $("#hello"), input = $("#helloName");
    return new Promise(resolve => {
      hello.oncancel = e => e.preventDefault();
      hello.onclose = () => { if (!USER_ID) hello.showModal(); };  // a second Escape still closes it in Chrome
      $("#helloForm").onsubmit = () => {
        USER_ID = input.value.trim().replace(/\s+/g, " ");
        store.set("pantryrun.name", USER_ID);
        logEvent("hello", {});
        resolve();
      };
      input.oninput = () => input.setCustomValidity(input.value.trim() ? "" : "Please type your name.");
      hello.showModal();
    });
  }

  // ── start ─────────────────────────────────────────────────────────────
  (async () => {
    placePill();
    document.fonts?.ready.then(placePill);
    idle("Getting the dinners", "One moment.");
    const named = USER_ID ? Promise.resolve() : askName();
    try {
      Object.assign(state, (({ recipes, dishes, categories }) => ({ recipes, dishes, categories }))(await api("/recipes")));
      if (!["ideas", "classics", "mine", ...state.categories.map(c => c.id)].includes(state.category)) state.category = "ideas";
      await named;
      state.mine = (await api(`/my-dinners?user_id=${encodeURIComponent(USER_ID)}`).catch(() => ({ dinners: [] }))).dinners;
      const token = new URLSearchParams(location.search).get("dinner");
      if (token) {
        state.shared = await api(`/shares/${encodeURIComponent(token)}?user_id=${encodeURIComponent(USER_ID)}`).catch(() => null);
        if (state.shared) state.recipeId = state.shared.id;
      }
      render();
      if (token && !state.shared) idle("This link doesn't lead to a dinner", "It may be mistyped. Pick a dinner here instead.");
    } catch {
      failed(() => location.reload());
    }
  })();
})();
</script>
</body>
</html>
