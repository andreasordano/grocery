services:
  db:
    # A throwaway database for local runs and tests. Its password is not a secret: it holds only test data and
    # is reachable from this computer only (ports below). Production's credentials live only in Render.
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: groceries
      POSTGRES_PASSWORD: groceries
      POSTGRES_DB: groceries
    ports:
      - "127.0.0.1:5433:5432"   # this computer only; host 5433 to avoid clashing with a local Postgres on 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U groceries -d groceries"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: postgresql://groceries:groceries@db:5432/groceries
      # Optional tuning knobs
      FETCH_CACHE_TTL: "21600"      # seconds
      FETCH_CACHE_MAX: "512"
      PER_STORE_LIMIT: "12"
    # the app never creates tables: apply supabase/migrations first (scripts/migrate.py)
    command: sh -c "python -m scripts.migrate && uvicorn api.service:app --host 0.0.0.0 --port 8000"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"   # this computer only
    volumes:
      - ./:/app:delegated

volumes:
  pgdata:
