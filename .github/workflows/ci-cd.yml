name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          python -m playwright install --with-deps chromium

      - name: Run tests (including the browser tests in tests/e2e)
        run: python -m pytest -q tests

  secrets:
    name: Look for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (every commit, so old ones are checked too)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail if a password or key was ever committed (gitleaks)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 git /repo --redact --no-banner
