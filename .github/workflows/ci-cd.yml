name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    services:
      postgres:  # the only database, as in production (core/db.py); tests/conftest.py migrates a test database
        image: postgres:16-alpine
        env:
          POSTGRES_USER: groceries
          POSTGRES_PASSWORD: groceries
          POSTGRES_DB: groceries
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U groceries -d groceries"
          --health-interval 2s --health-timeout 3s --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://groceries:groceries@localhost:5432/groceries
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          python -m playwright install --with-deps chromium

      - name: Run tests (including the browser tests in tests/e2e)
        run: python -m pytest -q tests

  secrets:
    name: Look for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (every commit, so old ones are checked too)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail if a password or key was ever committed (gitleaks)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 git /repo --redact --no-banner
